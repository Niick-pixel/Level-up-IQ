<!doctype html>
<html lang="en" data-theme="night">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' mg-cache: data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>Mind Gym</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="app.css" />
  <link rel="stylesheet" href="games/games.css" />
</head>
<body>
  <header class="titlebar">
    <a class="brand" href="#/" aria-label="Mind Gym home"><span class="brand-dot" aria-hidden="true"></span>Mind Gym</a>
    <div class="search" role="search">
      <input id="search" type="search" placeholder="Search keywords and games  (Ctrl+K)" autocomplete="off"
             aria-label="Search keywords and games" aria-controls="search-results" aria-expanded="false" />
      <ul id="search-results" class="search-results" role="listbox" hidden></ul>
    </div>
  </header>

  <div class="shell">
    <nav class="sidebar" aria-label="Main">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/mix" data-nav="mix">Daily Mix</a>
      <a href="#/games" data-nav="games">Games</a>
      <a href="#/keywords" data-nav="keywords">Keywords</a>
      <a href="#/review" data-nav="review">Review</a>
      <a href="#/watch" data-nav="watch">Watch later</a>
      <a href="#/stats" data-nav="stats">Stats</a>
      <span class="grow"></span>
      <a href="#/settings" data-nav="settings">Settings</a>
    </nav>
    <main id="view" tabindex="-1"></main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
